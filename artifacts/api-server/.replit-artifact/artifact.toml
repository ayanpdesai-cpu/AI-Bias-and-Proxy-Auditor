kind = "api"
previewPath = "/"
title = "BiasX Python Apps"
version = "1.0.0"
id = "3B4_FFSkEVBkAeYMFRJ2e"

[[services]]
localPort = 5000
name = "Streamlit"
paths = ["/"]

[services.env]
PORT = "5000"

[services.development]
run = "cd ../.. && exec python -m streamlit run app.py --server.port $PORT --server.address 0.0.0.0"

[services.production.build]
args = ["bash", "-c", "uv pip install --prefix \"$(python -m site --user-base)\" -r requirements.txt"]

[services.production.run]
args = ["python", "-m", "streamlit", "run", "app.py", "--server.port", "5000", "--server.address", "0.0.0.0"]

[services.production.health.startup]
path = "/"

[[services]]
localPort = 8080
name = "Python API"
paths = ["/columns", "/run-audit"]

[services.env]
PORT = "8080"

[services.development]
run = "cd ../.. && exec python api.py"
