kind = "web"
previewPath = "/biasx/"
title = "BiasX Web App"
description = "BiasX is a browser-based CSV auditor that helps users review potential bias and proxy-variable signals using correlations, mutual information, group outcome gaps, visualizations, and downloadable PDF reports. It runs separately from the original Streamlit app."
version = "1.0.0"
id = "artifacts/biasx"
router = "path"

[[services]]
name = "web"
paths = [ "/biasx/" ]
localPort = 20053

[services.development]
run = "pnpm --filter @workspace/biasx run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/biasx", "run", "build" ]
serve = "static"
publicDir = "artifacts/biasx/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "20053"
BASE_PATH = "/biasx/"
